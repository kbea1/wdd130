<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Alma's River Adventures</title>
    <meta name="description"
      content="Contact Alma's River Adventures for questions, reservations, or feedback about our white water rafting trips.">
    <meta name="author" content="Karla Loyaga">
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Alma's River Adventures Logo" id="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>
            <p>Address: 123 River Road, Rexburg, ID 83440</p>
            <p>Phone: (208) 555-0123</p>
            <p>Email: info@almasriveradventures.com</p>
        </section>

        <section class="contact-map-form">
            <section class="map">
                <iframe
                  src="https://www.google.com/maps?q=123+River+Road,+Rexburg,+ID+83440&output=embed"
                  width="400" height="300" allowfullscreen>
                </iframe>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>
                <form action="#" method="post">
                    <div class="form-row">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset>
                        <legend>Purpose of your message:</legend>
                        <label><input type="radio" id="purpose-general" name="purpose"
                              value="general" checked>
                            General Inquiry</label>
                        <label><input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question</label>
                        <label><input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion</label>
                    </fieldset>

                    <div class="form-row">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <label class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </section>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="team">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of Sofia Ramirez">
                    <figcaption>Sofia Ramirez<br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of Marco Diaz">
                    <figcaption>Marco Diaz<br>Rafting Instructor</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Diego Torres">
                    <figcaption>Diego Torres<br>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Alma's River Adventures | Karla Loyaga</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/youtube.png" alt="YouTube"></a>
        </nav>
    </footer>
</body>

</html>
